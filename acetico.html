<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor AR 360°</title>
    
    <!-- Cargamos los scripts oficiales de Google Model-Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        /* Restablecemos márgenes para usar toda la pantalla del teléfono */
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f8f9fa; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        
        /* Contenedor principal centrado */
        .contenedor { 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        
        /* Estilizado del visor 3D */
        model-viewer { 
            width: 92%; 
            height: 82vh; 
            background-color: #ffffff; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        
        /* Título inferior que acompaña la experiencia */
        .titulo { 
            margin-top: 15px; 
            font-size: 1.2rem; 
            color: #2d3748; 
            font-weight: 700;
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <!-- 
          Configuración de Model-Viewer:
          - src: Nombre de tu archivo .glb en el repositorio.
          - ar: Activa la compatibilidad con Realidad Aumentada.
          - camera-controls: Permite que el alumno use sus dedos para hacer zoom o detener el giro.
          - auto-rotate: Hace que la molécula rote sola en 360 grados.
          - rotation-per-second: Controla la velocidad del giro constante (30 grados por segundo).
        -->
        <model-viewer 
            src="Acetico.glb" 
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            camera-controls 
            touch-action="none" 
            shadow-intensity="1" 
            auto-rotate
            rotation-per-second="30deg"
            alt="Modelo 3D interactivo en rotación continua 360°">
        </model-viewer>
        
        <!-- Puedes cambiar este texto en cada página para que coincida con el ácido correspondiente -->
        <div class="titulo">Ácido Acético 3D AR</div>
    </div>

</body>
</html>
