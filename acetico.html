<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor AR - Ácido Acético</title>
    <!-- Cargamos los scripts oficiales de Google Model-Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #f0f0f0; font-family: sans-serif; }
        .contenedor { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        model-viewer { width: 90%; height: 80vh; background-color: #ffffff; border-radius: 12px; }
        .titulo { margin-top: 10px; font-size: 1.2rem; color: #333; font-weight: bold; }
    </style>
</head>
<body>

    <div class="contenedor">
        <!-- El visor interactivo de Google -->
        <model-viewer 
            src="Acetico.glb" 
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            camera-controls 
            touch-action="none" 
            shadow-intensity="1" 
            alt="Modelo 3D interactivo de Ácido Acético">
        </model-viewer>
        <div class="titulo">Ácido Acético - Kit 3D AR</div>
    </div>

</body>
</html>
